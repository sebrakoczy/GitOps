name: SkillForge PR - Ephemeral Environment Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/skillforge-platform/**'
  workflow_dispatch: {}

jobs:
  ephemeral-integration-test:
    runs-on: self-hosted

    # Docker-in-Docker: this job gets its own isolated Docker daemon.
    # Everything built/run inside it is destroyed when the job ends.
    services:
      docker:
        image: docker:27-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 2375:2375

    env:
      DOCKER_HOST: tcp://localhost:2375

    steps:
      - uses: actions/checkout@v4

      - name: Wait for DinD daemon
        run: |
          for i in $(seq 1 30); do
            docker info >/dev/null 2>&1 && break
            echo "Waiting for Docker daemon..."
            sleep 2
          done
          docker info | head -20

      - name: Spin up ephemeral environment
        working-directory: apps/skillforge-platform
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for API readiness
        working-directory: apps/skillforge-platform
        run: |
          for i in $(seq 1 36); do
            if docker compose exec -T skillforge-api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)" 2>/dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/36)"
            sleep 5
          done
          echo "API never became healthy — dumping logs"
          docker compose logs skillforge-api
          exit 1

      - name: Integration smoke tests
        working-directory: apps/skillforge-platform
        run: |
          docker compose exec -T skillforge-api python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).read().decode())"
          docker compose exec -T skillforge-api python -c "import urllib.request; r = urllib.request.urlopen('http://skillforge-web:8080', timeout=3); print('web status:', r.status)"
          echo "Smoke tests passed"

      - name: Teardown ephemeral environment
        if: always()
        working-directory: apps/skillforge-platform
        run: |
          docker compose down -v --remove-orphans
          echo "Ephemeral environment destroyed"
