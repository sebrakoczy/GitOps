# .github/workflows/skillforge-ci.yml
name: SkillForge CI - Build, Scan, Push, Update Manifests

on:
  push:
    branches: [main]
    paths:
      - 'apps/skillforge-platform/**'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - service: web
            dockerfile: frontend/Dockerfile
            image: skillforge-web
          - service: api
            dockerfile: backend/Dockerfile
            image: skillforge-api
          - service: worker
            dockerfile: worker/Dockerfile
            image: skillforge-worker
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load for scanning)
        uses: docker/build-push-action@v5
        with:
          context: apps/skillforge-platform
          file: apps/skillforge-platform/${{ matrix.dockerfile }}
          load: true
          tags: ghcr.io/sebrakoczy/${{ matrix.image }}:${{ steps.vars.outputs.sha_tag }}

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/sebrakoczy/${{ matrix.image }}:${{ steps.vars.outputs.sha_tag }}
          severity: CRITICAL,HIGH
          exit-code: '0'   # report only, don't block (set to '1' once you've triaged existing CVEs)

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: apps/skillforge-platform
          file: apps/skillforge-platform/${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/sebrakoczy/${{ matrix.image }}:${{ steps.vars.outputs.sha_tag }}

  update-manifest:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update image tags in values-homelab-nodeport.yaml
        env:
          SHA_TAG: ${{ needs.build-and-push.outputs.sha_tag }}
          VALUES_FILE: apps/skillforge-platform/deploy/helm/skillforge/values-homelab-nodeport.yaml
        run: |
          sed -i -E "/skillforge-web/{n;s/tag: \".*\"/tag: \"${SHA_TAG}\"/}" "$VALUES_FILE"
          sed -i -E "/skillforge-api/{n;s/tag: \".*\"/tag: \"${SHA_TAG}\"/}" "$VALUES_FILE"
          sed -i -E "/skillforge-worker/{n;s/tag: \".*\"/tag: \"${SHA_TAG}\"/}" "$VALUES_FILE"
          cat "$VALUES_FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/skillforge-platform/deploy/helm/skillforge/values-homelab-nodeport.yaml
          git diff --staged --quiet || git commit -m "ci: update skillforge image tags to ${{ needs.build-and-push.outputs.sha_tag }}"
          git push
