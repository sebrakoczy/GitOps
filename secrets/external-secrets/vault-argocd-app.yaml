apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sebrakoczy/GitOps.git
    targetRevision: HEAD
    path: secrets/external-secrets/vault
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
