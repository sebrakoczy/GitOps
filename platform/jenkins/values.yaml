controller:
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "2.555.2-jdk21"
    pullPolicy: IfNotPresent
  installLatestPlugins: true
  persistence:
    enabled: true
    storageClass: longhorn
    size: 20Gi
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
  JCasC:
    defaultConfig: false
    configScripts:
      kubernetes-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                containerCapStr: "20"
                skipTlsVerify: "true"
                templates:
                  - name: "default"
                    namespace: "jenkins"
                    label: "k8s"
                    idleMinutes: 2
                    serviceAccount: "jenkins"
                    nodeUsageMode: "NORMAL"
                    nodeSelector: "node-role=worker"
                    containers:
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:latest"
                        alwaysPullImage: true
                        args: "^${computer.jnlpmac} ^${computer.name}"
                        workingDir: "/home/jenkins/agent"
                        ttyEnabled: true
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "1"
                        resourceLimitMemory: "1Gi"

  runAsUser: 1000
  fsGroup: 1000

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  serviceType: NodePort
  nodePort: 32080

rbac:
  create: true

serviceAccount:
  create: true
  name: jenkins

agent:
  enabled: true
  image:
    repository: jenkins/inbound-agent
    tag: latest
  resources:
    requests:
      cpu: 200m
      memory: 256Mi

