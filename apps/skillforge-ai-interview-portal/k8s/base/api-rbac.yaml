apiVersion: v1
kind: ServiceAccount
metadata:
  name: skillforge-api
  namespace: skillforge
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skillforge-judge-runner
  namespace: skillforge
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skillforge-api-judge-runner
  namespace: skillforge
subjects:
  - kind: ServiceAccount
    name: skillforge-api
    namespace: skillforge
roleRef:
  kind: Role
  name: skillforge-judge-runner
  apiGroup: rbac.authorization.k8s.io
