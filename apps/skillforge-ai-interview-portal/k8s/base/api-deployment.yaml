apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillforge-api
  namespace: skillforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skillforge-api
  template:
    metadata:
      labels:
        app: skillforge-api
    spec:
      serviceAccountName: skillforge-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/sebrakoczy/skillforge-api:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: skillforge-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: skillforge-postgres
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: skillforge-api-data
