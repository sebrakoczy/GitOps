apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillforge
  namespace: skillforge
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "250m"
spec:
  ingressClassName: nginx
  rules:
    - host: skillforge.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: skillforge-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skillforge-web
                port:
                  number: 8080
