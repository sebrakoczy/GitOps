apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skillforge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/skillforge-platform.git
    targetRevision: main
    path: deploy/helm/skillforge
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: skillforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
