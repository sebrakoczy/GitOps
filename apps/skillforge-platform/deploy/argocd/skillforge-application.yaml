apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skillforge
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sebrakoczy/GitOps.git
    targetRevision: main
    path: apps/skillforge-platform/deploy/helm/skillforge
    helm:
      valueFiles:
        - values-homelab-nodeport.yaml
      parameters:
        - name: imagePullSecrets[0].name
          value: ghcr-pull

  destination:
    server: https://kubernetes.default.svc
    namespace: skillforge

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
