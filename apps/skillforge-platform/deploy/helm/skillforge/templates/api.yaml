apiVersion: v1
kind: Service
metadata:
  name: skillforge-api
  labels:
    {{- include "skillforge.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.service.api.port }}
      targetPort: 8000
  selector:
    {{- include "skillforge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillforge-api
  labels:
    {{- include "skillforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      {{- include "skillforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "skillforge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: skillforge-api
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: skillforge-postgres
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://skillforge-redis:6379/0
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: {{ .Values.podSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.podSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: {{ toYaml .Values.podSecurityContext.capabilities.drop | nindent 16 }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
