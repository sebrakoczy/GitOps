{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: skillforge-redis
  labels:
    {{- include "skillforge.labels" . | nindent 4 }}
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    {{- include "skillforge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: skillforge-redis
  labels:
    {{- include "skillforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: skillforge-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "skillforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "skillforge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.redis.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.redis.storageSize | quote }}
{{- end }}
