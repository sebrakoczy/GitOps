apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillforge-worker
  labels:
    {{- include "skillforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      {{- include "skillforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "skillforge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: skillforge-worker
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          env:
            - name: REDIS_URL
              value: redis://skillforge-redis:6379/0
            - name: RUNNER_MODE
              value: {{ .Values.env.runnerMode | quote }}
            - name: GRADER_JOB_NAMESPACE
              value: {{ .Values.graders.jobNamespace | quote }}
            - name: GRADER_JOB_IMAGE
              value: {{ .Values.graders.jobImage | quote }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.podSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.podSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: {{ toYaml .Values.podSecurityContext.capabilities.drop | nindent 16 }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
