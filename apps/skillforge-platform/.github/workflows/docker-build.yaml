name: docker-build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -f backend/Dockerfile -t skillforge-api:test .
      - name: Build Web image
        run: docker build -f frontend/Dockerfile -t skillforge-web:test .
      - name: Build Worker image
        run: docker build -f worker/Dockerfile -t skillforge-worker:test .
