metadata:
  version: 0.2.0
  name: SkillForge Platform Engineering Interview Bank
  description: Comprehensive senior Platform Engineer interview preparation bank covering
    Kubernetes, Linux, IaC, GitOps, DevSecOps, SRE, cloud, systems design, and behavioral
    leadership.
  question_count: 432
  challenge_count: 48
categories:
- slug: platform-engineering
  name: Platform Engineering
  description: Internal developer platforms, golden paths, self-service, paved roads,
    developer experience, platform product thinking.
- slug: kubernetes-core
  name: Kubernetes Core
  description: Pods, Deployments, Services, scheduling, controllers, probes, resource
    management, and API object fundamentals.
- slug: kubernetes-troubleshooting
  name: Kubernetes Troubleshooting
  description: CrashLoopBackOff, Pending pods, image pulls, probes, events, rollout
    failures, service routing, and debugging workflows.
- slug: kubernetes-networking
  name: Kubernetes Networking
  description: Services, DNS, Ingress, Gateway API, kube-proxy, CNI, NetworkPolicy,
    NodePort, LoadBalancer, and traffic flows.
- slug: kubernetes-storage
  name: Kubernetes Storage
  description: PV/PVC, StorageClasses, StatefulSets, snapshots, Longhorn-style storage,
    backups, and stateful workload operations.
- slug: kubernetes-security
  name: Kubernetes Security
  description: RBAC, Pod Security Standards, admission control, secrets, image policy,
    runtime security, audit, and cluster hardening.
- slug: cilium-ebpf
  name: Cilium / eBPF Networking
  description: Cilium policies, identities, Hubble, eBPF datapath, NodePort, kube-proxy
    replacement, and network troubleshooting.
- slug: linux
  name: Linux Systems
  description: systemd, processes, filesystems, permissions, networking, kernel/sysctl,
    journald, LVM, and operational troubleshooting.
- slug: bash
  name: Bash Automation
  description: Shell scripting, text processing, idempotent automation, safe error
    handling, jq/sed/awk/grep/xargs, and operational scripts.
- slug: terraform
  name: Terraform / IaC
  description: Terraform modules, state, providers, remote backends, drift, imports,
    refactoring, testing, and multi-environment design.
- slug: ansible
  name: Ansible Configuration
  description: Inventories, playbooks, roles, handlers, templates, facts, Vault, idempotency,
    dynamic inventory, and Linux automation.
- slug: gitops-cicd
  name: GitOps / Argo CD
  description: Declarative delivery, sync waves, Helm/Kustomize, app-of-apps, rollback,
    drift detection, promotion, and secrets integration.
- slug: cicd-release
  name: CI/CD & Release Engineering
  description: Pipeline design, testing gates, artifact promotion, build security,
    rollback, preview environments, and release strategies.
- slug: cloud-networking
  name: Cloud / AWS Networking
  description: VPC design, IAM, security groups, load balancing, DNS, private connectivity,
    multi-account patterns, and cloud operations.
- slug: observability-sre
  name: Observability / SRE
  description: Metrics, logs, traces, SLIs/SLOs, alerting, incident response, capacity,
    error budgets, and reliability engineering.
- slug: devsecops-supply-chain
  name: DevSecOps / Supply Chain
  description: SAST, DAST, SBOMs, image signing, provenance, dependency management,
    policy-as-code, and compliance controls.
- slug: containers-runtime
  name: Containers & Runtime
  description: Dockerfiles, image hardening, OCI concepts, containerd, rootless, capabilities,
    seccomp, cgroups, and build optimization.
- slug: databases-stateful
  name: Databases & Stateful Workloads
  description: PostgreSQL/MySQL on Kubernetes, backups, replication, upgrades, migrations,
    PVC recovery, and operational safety.
- slug: secrets-identity
  name: Secrets & Identity
  description: External Secrets, Vault, OIDC, workload identity, service accounts,
    secret rotation, certificates, and least privilege.
- slug: system-design
  name: Platform System Design
  description: Designing multi-cluster platforms, IDPs, secure networks, CI/CD systems,
    observability platforms, and migration architectures.
- slug: incident-dr
  name: Incident Response / DR
  description: Runbooks, disaster recovery, etcd restore, backup verification, postmortems,
    change control, and production readiness.
- slug: performance-capacity
  name: Performance & Capacity
  description: Resource requests/limits, autoscaling, saturation, profiling, bin-packing,
    load testing, and cost-aware reliability.
- slug: automation-languages
  name: Python / Go Automation
  description: Production-grade automation using Python, Go, APIs, CLIs, SDKs, tests,
    packaging, and maintainable tooling.
- slug: leadership-behavioral
  name: Leadership & Behavioral
  description: Senior/principal-level communication, ownership, prioritization, mentoring,
    design reviews, stakeholder management, and tradeoffs.
questions:
- slug: platform-engineering-explain-01
  title: 'Platform Engineering: Golden Path Design'
  category: platform-engineering
  difficulty: Beginner
  type: short_answer
  prompt: 'Design a golden path for deploying a service to Kubernetes without reducing
    team autonomy.


    Give a senior-level answer with the key checks, tradeoffs, and operational risks.'
  correct_answer:
    keywords:
    - self-service
    - standardization
    - guardrails
    - developer experience
    - ownership
  explanation: A strong answer should mention self-service, standardization, guardrails,
    developer experience, ownership. Bonus points for specific commands, validation
    steps, rollback, and security/reliability tradeoffs.
