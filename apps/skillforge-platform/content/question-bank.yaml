- slug: platform-engineering-signals-ms-01
  title: 'Diagnostic Signals: Developer Experience Metrics'
  category: platform-engineering
  difficulty: Advanced
  type: multi_select
  prompt: Select the signals you should gather before proposing a fix for developer
    experience metrics.
  choices:
  - Relevant logs, events, metrics, traces, or audit records
  - Current desired-state configuration from Git/IaC
  - Recent changes, deployments, incidents, or infrastructure events
  - A rollback or mitigation path and validation criteria
  - Only a guess based on the first symptom
  - A broad production change without impact analysis
  correct_answer:
  - Relevant logs, events, metrics, traces, or audit records
  - Current desired-state configuration from Git/IaC
  - Recent changes, deployments, incidents, or infrastructure events
  - A rollback or mitigation path and validation criteria
  explanation: A disciplined troubleshooting answer gathers evidence, checks source-of-truth,
    identifies recent change, and defines safe mitigation/validation before changing
    production.
  tags:
  - developer experience metrics
  - troubleshooting
  - signals
