challenges:
- slug: platform-engineering-diagnostic-runbook
  title: 'Platform Engineering: Write a Production Diagnostic Runbook'
  category: platform-engineering
  difficulty: Intermediate
  type: scenario_lab
  prompt: 'Create a concise runbook for the scenario. Include symptoms, commands/checks,
    decision points, mitigation, rollback, and verification.


    Scenario focus: Internal developer platforms, golden paths, self-service, paved
    roads, developer experience, platform product thinking.'
  starter_files:
    answer.md: '# Platform Engineering Write a Production Diagnostic Runbook


      ## Context


      ## Checks


      ## Decision Points


      ## Mitigation


      ## Verification


      ## Rollback

      '
  test_rules: &id001
  - type: contains
    name: Includes kubectl/logging checks
    value: kubectl
  - type: regex
    name: Has verification section
    pattern: (?i)(verify|validation|success criteria)
  - type: regex
    name: Has rollback/mitigation
    pattern: (?i)(rollback|mitigation|restore)
  - type: line_count_min
    name: Enough operational detail
    value: 10
  explanation: This static lab checks for the structure of a senior-level operational/design
    answer. Future versions can add rubric scoring and AI evaluator feedback.
  tags:
  - platform-engineering
  - lab
  - senior-platform-engineer
