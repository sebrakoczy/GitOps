challenges:
  - slug: bash-auth-log-top-ips
    title: Parse failed SSH login IPs
    category: bash
    difficulty: Intermediate
    type: bash_challenge
    prompt: |
      Write a Bash script that reads auth.log from the current directory and prints the top 5 IP addresses with failed SSH login attempts.
      The solution should be safe with unset variables and failed pipelines.
    starter_files:
      solution.sh: |
        #!/usr/bin/env bash
        set -euo pipefail
        # TODO: parse auth.log
    test_rules:
      - name: Uses safer Bash mode
        type: contains
        value: set -euo pipefail
      - name: Uses grep or awk to filter failed logins
        type: regex
        pattern: "(grep|awk)"
      - name: Sorts and counts unique IPs
        type: regex
        pattern: "(sort|uniq|awk)"
      - name: Limits output to five
        type: regex
        pattern: "(head -n ?5|NR<=5)"
    explanation: A strong answer filters failed login rows, extracts IPs, counts unique values, sorts numerically, and prints the top five.
    tags: [bash, logs]
  - slug: k8s-fix-readiness-probe
    title: Fix a readiness probe
    category: kubernetes-troubleshooting
    difficulty: Intermediate
    type: kubernetes_manifest_challenge
    prompt: |
      A Deployment should only receive traffic after /healthz returns HTTP 200 on port 8080.
      Provide the corrected container probe YAML section.
    starter_files:
      deployment.yaml: |
        readinessProbe:
          httpGet:
            path: /wrong
            port: 80
    test_rules:
      - name: Uses readinessProbe
        type: contains
        value: readinessProbe
      - name: Checks /healthz
        type: contains
        value: /healthz
      - name: Uses port 8080
        type: regex
        pattern: "port:\\s*8080"
      - name: Uses HTTP GET probe
        type: contains
        value: httpGet
    explanation: Correct readiness probes keep unready pods out of Service endpoints until they can serve traffic.
    tags: [kubernetes, probes]
  - slug: k8s-networkpolicy-deny-all
    title: Write a default deny NetworkPolicy
    category: kubernetes-security
    difficulty: Advanced
    type: kubernetes_manifest_challenge
    prompt: |
      Write a NetworkPolicy that selects all pods in the namespace and denies all ingress traffic by default.
    starter_files:
      networkpolicy.yaml: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
    test_rules:
      - name: Uses NetworkPolicy kind
        type: contains
        value: "kind: NetworkPolicy"
      - name: Selects all pods
        type: regex
        pattern: "podSelector:\\s*\\n\\s*\\{?\\}?"
      - name: Defines Ingress policy type
        type: contains
        value: Ingress
      - name: Does not allow all CIDRs
        type: not_contains
        value: 0.0.0.0/0
    explanation: A default deny ingress policy selects pods and contains policyTypes ingress without broad allow rules.
    tags: [networkpolicy, security]
  - slug: terraform-vpc-module
    title: Define reusable Terraform module inputs
    category: terraform
    difficulty: Intermediate
    type: terraform_challenge
    prompt: |
      Create Terraform variable definitions for a reusable VPC module. It must accept vpc_cidr, public_subnets, private_subnets, and environment.
    starter_files:
      variables.tf: |
        variable "vpc_cidr" {
          type = string
        }
    test_rules:
      - name: Defines vpc_cidr variable
        type: regex
        pattern: "variable\\s+\"vpc_cidr\""
      - name: Defines public_subnets variable
        type: regex
        pattern: "variable\\s+\"public_subnets\""
      - name: Defines private_subnets variable
        type: regex
        pattern: "variable\\s+\"private_subnets\""
      - name: Defines environment variable
        type: regex
        pattern: "variable\\s+\"environment\""
      - name: Uses typed lists for subnets
        type: regex
        pattern: "list\\(string\\)"
    explanation: Reusable modules should expose typed inputs and avoid hard-coded environment assumptions.
    tags: [terraform, modules]
  - slug: ansible-nginx-template
    title: Ansible handler for nginx config
    category: ansible
    difficulty: Intermediate
    type: ansible_challenge
    prompt: |
      Write Ansible tasks that render an nginx config from a Jinja2 template and notify a handler to reload nginx only when the file changes.
    starter_files:
      tasks.yml: |
        - name: Render nginx config
          ansible.builtin.template:
    test_rules:
      - name: Uses template module
        type: contains
        value: ansible.builtin.template
      - name: Defines destination
        type: regex
        pattern: "dest:"
      - name: Notifies handler
        type: regex
        pattern: "notify:"
      - name: Reloads or restarts nginx
        type: regex
        pattern: "(reload nginx|restart nginx|state:\\s*reloaded|state:\\s*restarted)"
    explanation: Handlers avoid unnecessary reloads and preserve idempotent behavior.
    tags: [ansible, handlers]
  - slug: linux-systemd-timer
    title: systemd timer for backups
    category: linux
    difficulty: Intermediate
    type: linux_challenge
    prompt: |
      Write a systemd timer that runs etcd-backup.service every 6 hours and persists missed runs after boot.
    starter_files:
      etcd-backup.timer: |
        [Unit]
        Description=Run etcd backup every 6 hours
    test_rules:
      - name: Has Timer section
        type: contains
        value: "[Timer]"
      - name: Runs every 6 hours
        type: regex
        pattern: "OnUnitActiveSec=6h|OnCalendar=.*\\*/6"
      - name: Enables persistence
        type: contains
        value: Persistent=true
      - name: References service
        type: contains
        value: Unit=etcd-backup.service
    explanation: Persistent timers catch up missed runs after downtime, useful for backup jobs.
    tags: [systemd, backup]
  - slug: gitops-argocd-app
    title: Argo CD Application for a Helm chart
    category: gitops-cicd
    difficulty: Intermediate
    type: yaml_challenge
    prompt: |
      Write an Argo CD Application manifest that deploys the skillforge Helm chart from the deploy/helm/skillforge path into the skillforge namespace.
    starter_files:
      application.yaml: |
        apiVersion: argoproj.io/v1alpha1
        kind: Application
    test_rules:
      - name: Uses Application kind
        type: contains
        value: "kind: Application"
      - name: References chart path
        type: contains
        value: deploy/helm/skillforge
      - name: Targets namespace
        type: contains
        value: "namespace: skillforge"
      - name: Uses automated sync policy or sync policy block
        type: regex
        pattern: "syncPolicy:"
    explanation: The Application should point at the Git repo/path and let Argo CD reconcile the namespace state.
    tags: [argocd, helm]
  - slug: sre-prometheus-alert
    title: Prometheus alert for pod crash loops
    category: observability-sre
    difficulty: Advanced
    type: yaml_challenge
    prompt: |
      Write a Prometheus alert rule that fires when a container has restarted more than 5 times in 10 minutes.
    starter_files:
      rule.yaml: |
        groups:
          - name: kubernetes-workloads
    test_rules:
      - name: Defines alert
        type: regex
        pattern: "alert:"
      - name: Uses restart metric
        type: contains
        value: kube_pod_container_status_restarts_total
      - name: Has threshold greater than five
        type: regex
        pattern: ">\\s*5"
      - name: Has duration or range window
        type: regex
        pattern: "(for:|\\[10m\\])"
    explanation: Alerting on restart increases over a window is better than alerting on raw restart counters.
    tags: [prometheus, alerting]
